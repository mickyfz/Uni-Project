{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="box">
            <h4>Add New Viva</h4>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Course:</label>
                    {{ form.course }}
                </div>
                <div class="mb-3">
                    <label class="form-label">Part (Midterm or Final):</label>
                    {{ form.term }}
                </div>
                <div class="mb-3">
                    <label class="form-label">Viva Title:</label>
                    {{ form.title }}
                </div>
                <div class="mb-3">
                    <label class="form-label">Questions / Topics for Student Video:</label>
                    {{ form.description }}
                </div>
                <div class="mb-3">
                    <label class="form-label">Total Viva Marks:</label>
                    {{ form.total_marks }}
                </div>
                <div class="mb-3 form-check">
                    {{ form.is_published }}
                    <label class="form-check-label" for="{{ form.is_published.id_for_label }}">Active</label>
                </div>
                <button type="submit" class="btn btn-success w-100">Save Viva</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
